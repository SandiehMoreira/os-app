name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Config pública do Firebase Web (não é secreta por design — a
          # segurança vem das regras do Firestore, não do sigilo da chave)
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyB_k0ChXHkGGXZ8THnFcNwKL5TlX-5gGZQ
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: os-tec.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: os-tec
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: os-tec.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1099157468066"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1099157468066:web:076975223826d75d54b8fb"
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: zagfyygf
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: os-tecnica
          NEXT_PUBLIC_STORE_ID: default

      - name: Sync Capacitor (copia o build estático para o projeto Android)
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: os-tecnica-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
